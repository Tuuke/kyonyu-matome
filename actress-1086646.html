<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>姫野かりす 出演作品まとめ | 巨乳・爆乳好きのまとめサイト</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--bg2:#161616;--bg3:#1e1e1e;--bg4:#252525;
  --border:#2a2a2a;--border2:#333;
  --text:#f0f0f0;--text2:#aaa;--muted:#555;
  --red:#e63946;--red2:#c1121f;--red-bg:rgba(230,57,70,.12);--red-border:rgba(230,57,70,.3);
  --radius:8px;--radius2:12px;
}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}
a{color:inherit;text-decoration:none}
/* HEADER */
header{background:rgba(13,13,13,.95);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:0 24px;
  display:flex;align-items:center;gap:16px;height:56px;
  position:sticky;top:0;z-index:200}
.logo{font-size:17px;font-weight:800;letter-spacing:-.5px;white-space:nowrap;flex-shrink:0}
.logo span{color:var(--red)}
.logo a{color:inherit}
.h-search{flex:1;max-width:320px;background:var(--bg3);
  border:1px solid var(--border2);border-radius:20px;
  color:var(--text);font-size:13px;padding:7px 14px;outline:none;transition:.2s}
.h-search:focus{border-color:var(--red);background:var(--bg4)}
.h-count{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
/* LAYOUT */
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}
aside{background:var(--bg2);border-right:1px solid var(--border);
  padding:20px 14px;overflow-y:auto;position:sticky;top:56px;height:calc(100vh - 56px)}
.s-section{margin-bottom:22px}
.s-label{font-size:10px;font-weight:700;color:var(--muted);
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;
  display:flex;align-items:center;gap:6px}
.s-label::before{content:"";display:inline-block;width:3px;height:11px;
  background:var(--red);border-radius:2px}
/* TAGS */
.tag-list{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;padding:4px 10px;border-radius:20px;
  border:1px solid var(--border2);background:var(--bg3);color:var(--text2);
  cursor:pointer;user-select:none;transition:all .15s;white-space:nowrap}
.tag:hover{border-color:var(--red-border);color:var(--text);background:var(--bg4)}
.tag.active{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.clear-link{font-size:11px;color:var(--muted);background:none;
  border:none;cursor:pointer;padding:0;text-decoration:underline;transition:.15s}
.clear-link:hover{color:var(--text)}
/* CHIPS */
.main-wrap{padding:20px 24px;overflow-y:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;min-height:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;
  background:var(--red-bg);border:1px solid var(--red-border);color:var(--red);
  border-radius:20px;font-weight:500}
.chip button{background:none;border:none;color:var(--red);cursor:pointer;
  font-size:14px;line-height:1;padding:0;opacity:.8}
.chip button:hover{opacity:1}
/* BUST SLIDER */
.bust-slider-wrap{padding:4px 2px}
.bust-range-labels{display:flex;justify-content:space-between;
  font-size:12px;font-weight:700;color:var(--text);margin-bottom:12px}
.bust-range-labels span{background:var(--red-bg);border:1px solid var(--red-border);
  color:var(--red);padding:3px 10px;border-radius:12px;min-width:56px;text-align:center}
.slider-track{position:relative;height:4px;background:var(--bg4);
  border-radius:2px;margin:16px 0 8px}
.slider-fill{position:absolute;height:100%;background:var(--red);border-radius:2px;transition:.05s}
.slider-track input[type=range]{position:absolute;width:100%;height:100%;
  opacity:0;cursor:pointer;margin:0;top:0;left:0;pointer-events:none}
.slider-track input[type=range]::-webkit-slider-thumb{pointer-events:all;
  width:20px;height:20px;border-radius:50%;background:var(--red);
  -webkit-appearance:none;cursor:pointer;box-shadow:0 0 0 4px var(--red-bg),0 0 0 2px var(--red)}
.slider-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
/* MORE BTN */
.more-btn{display:block;width:100%;margin-top:8px;padding:5px;text-align:center;
  font-size:11px;cursor:pointer;border:1px solid var(--border2);
  background:var(--bg3);color:var(--text2);border-radius:6px;transition:.15s}
.more-btn:hover{border-color:var(--red-border);color:var(--red)}
/* PICKUP */
.pickup-section{margin-bottom:32px}
.pickup-header{font-size:11px;font-weight:700;color:var(--red);
  letter-spacing:.15em;text-transform:uppercase;margin-bottom:16px;
  display:flex;align-items:center;gap:10px}
.pickup-header::before,.pickup-header::after{content:"";flex:1;height:1px;background:var(--red-border)}
.pickup-card{border-color:var(--red-border) !important}
.pickup-badge{position:absolute;top:8px;left:8px;font-size:9px;font-weight:700;
  padding:3px 8px;border-radius:12px;background:var(--red);color:#fff;z-index:1;letter-spacing:.05em}
/* KANA SECTION */
.kana-section{margin-bottom:28px}
.kana-header{font-size:12px;font-weight:700;color:var(--text2);
  padding:5px 12px;margin-bottom:14px;
  border-left:3px solid var(--red);background:var(--bg2);
  border-radius:0 6px 6px 0;letter-spacing:.05em}
.kana-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.row-more-btn{display:block;width:100%;margin-top:12px;padding:8px;text-align:center;
  font-size:12px;font-weight:500;cursor:pointer;
  border:1px solid var(--border2);background:var(--bg2);
  color:var(--text2);border-radius:var(--radius);transition:.15s}
.row-more-btn:hover{border-color:var(--red-border);color:var(--red)}
/* ACTRESS GRID */
.actress-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
.actress-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);
  overflow:hidden;display:block;transition:all .2s;position:relative}
.actress-card:hover{border-color:var(--red-border);transform:translateY(-3px);
  box-shadow:0 8px 24px rgba(0,0,0,.4)}
.a-thumb{width:100%;aspect-ratio:3/4;background:var(--bg3);overflow:hidden;position:relative}
.a-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.actress-card:hover .a-thumb img{transform:scale(1.05)}
.no-photo{width:100%;height:100%;display:flex;align-items:center;
  justify-content:center;font-size:36px;opacity:.2}
.a-body{padding:10px 12px 12px}
.a-name{font-size:13px;font-weight:700;margin-bottom:3px}
.a-size{font-size:10px;color:var(--muted);margin-bottom:5px}
.a-cup{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;
  border-radius:10px;border:1px solid var(--red-border);background:var(--red-bg);color:var(--red)}
.a-count{font-size:10px;color:var(--muted);margin-top:5px}
/* ACTRESS HERO */
.breadcrumb{font-size:12px;color:var(--muted);padding:10px 24px;
  background:var(--bg2);border-bottom:1px solid var(--border)}
.breadcrumb a{color:var(--red)}
.actress-hero{padding:24px;background:var(--bg2);
  border-bottom:1px solid var(--border);display:flex;gap:18px;align-items:flex-start}
.hero-img{width:80px;height:107px;object-fit:cover;border-radius:var(--radius);
  background:var(--bg3);flex-shrink:0}
.hero-name{font-size:22px;font-weight:800;margin-bottom:5px}
.hero-name span{color:var(--red)}
.hero-meta{font-size:12px;color:var(--text2);margin-bottom:5px}
.hero-cup{font-size:12px;font-weight:700;padding:3px 10px;
  border-radius:12px;border:1px solid var(--red-border);background:var(--red-bg);color:var(--red)}
.editor-comment{margin-top:10px;padding:10px 12px;background:var(--bg3);
  border-left:3px solid var(--red);border-radius:0 6px 6px 0;
  font-size:12px;color:var(--text2);line-height:1.7;max-width:460px}
.editor-label{display:block;font-size:10px;font-weight:700;color:var(--red);
  letter-spacing:.1em;margin-bottom:4px}
/* COSTAR */
.costar-link{color:var(--red) !important;border-color:var(--red-border) !important;
  background:var(--red-bg) !important;text-decoration:none;display:inline-block}
.costar-link:hover{background:rgba(230,57,70,.22) !important}
/* WORK GRID */
.works-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.work-card{background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius2);overflow:hidden;transition:all .2s}
.work-card:hover{border-color:var(--border2);transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(0,0,0,.35)}
.work-card.hidden{display:none}
.w-thumb{width:100%;aspect-ratio:16/11;background:var(--bg3);overflow:hidden}
.w-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.work-card:hover .w-thumb img{transform:scale(1.04)}
.no-img{width:100%;height:100%;display:flex;align-items:center;
  justify-content:center;color:var(--muted);font-size:12px}
.w-body{padding:11px 13px 13px}
.w-title{font-size:13px;font-weight:600;margin-bottom:8px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.w-title a:hover{color:var(--red)}
.w-meta{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:11px;margin-bottom:8px}
.w-meta dt{color:var(--muted);white-space:nowrap}
.w-meta dd{color:var(--text2)}
.g-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.g-tag{font-size:10px;padding:3px 8px;border-radius:10px;
  background:var(--bg3);color:var(--text2);border:1px solid var(--border);
  cursor:pointer;transition:.15s}
.g-tag:hover{border-color:var(--red-border);color:var(--red)}
.g-tag.active{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.btn-fanza{display:block;text-align:center;font-size:12px;font-weight:700;
  padding:8px;border-radius:var(--radius);letter-spacing:.04em;
  border:none;color:#fff;background:var(--red2);transition:.15s}
.btn-fanza:hover{background:var(--red)}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:13px}
footer{text-align:center;padding:28px 24px;font-size:11px;
  color:var(--muted);border-top:1px solid var(--border);margin-top:24px}

/* ── SP用フィルターボタン ── */
.sp-filter-btn{
  display:none;align-items:center;gap:6px;padding:6px 12px;
  background:var(--red-bg);border:1px solid var(--red-border);
  color:var(--red);border-radius:20px;font-size:12px;font-weight:700;
  cursor:pointer;white-space:nowrap;flex-shrink:0
}
.sp-overlay{
  display:none;position:fixed;inset:0;z-index:299;
  background:rgba(0,0,0,.6)
}
.sp-overlay.open{display:block}
.sp-close-btn{
  position:absolute;top:14px;right:14px;
  background:var(--bg3);border:1px solid var(--border2);
  color:var(--text2);font-size:20px;width:36px;height:36px;
  border-radius:50%;cursor:pointer;display:flex;
  align-items:center;justify-content:center
}

@media(max-width:768px){
  .sp-filter-btn{display:flex}
  .layout{display:block}
  aside{
    display:none;position:fixed;left:0;top:0;bottom:0;z-index:300;
    width:80%;max-width:280px;padding:56px 14px 20px;
    overflow-y:auto;background:var(--bg2);
    box-shadow:4px 0 20px rgba(0,0,0,.6)
  }
  aside.open{display:block}
  .main-wrap{padding:12px}
  .actress-grid{grid-template-columns:repeat(4,1fr);gap:6px}
  .kana-grid,.kana-grid-vis{grid-template-columns:repeat(4,1fr);gap:6px}
  .works-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .a-body{padding:6px 8px 8px}
  .a-name{font-size:11px}
  .a-size{font-size:9px}
  .a-cup{font-size:9px;padding:1px 5px}
  .a-count{font-size:9px}
  .w-body{padding:8px 10px 10px}
  .w-title{font-size:11px}
  .h-count{display:none}
  .actress-hero{padding:12px;gap:10px;flex-wrap:wrap}
  .hero-img{width:56px;height:75px}
  .hero-name{font-size:16px}
  .breadcrumb{padding:8px 12px;font-size:11px}
  .editor-comment{max-width:100%}
}
@media(max-width:400px){
  .actress-grid,.kana-grid,.kana-grid-vis{grid-template-columns:repeat(3,1fr);gap:4px}
  .works-grid{grid-template-columns:repeat(1,1fr)}
}

.costar-link{color:var(--red)!important;border-color:rgba(230,57,70,.4)!important;background:rgba(230,57,70,.12)!important;text-decoration:none!important;display:inline-block!important;cursor:pointer!important;pointer-events:auto!important}
.costar-link:hover{background:rgba(230,57,70,.25)!important}
.more-btn{display:inline-block;margin-top:6px;cursor:pointer;font-size:11px}
.clickable-gtag{cursor:pointer;transition:.12s}
.clickable-gtag:hover{border-color:var(--red-dim);color:var(--text);background:var(--bg2)}
.a-cup{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;border:1px solid var(--red-dim);background:var(--red-bg);color:var(--red);margin-top:3px}
.editor-comment{margin-top:12px;padding:10px 14px;background:var(--bg3);
  border-left:3px solid var(--red);border-radius:0 6px 6px 0;
  font-size:12px;color:var(--text2);line-height:1.8;max-width:460px}
.editor-label{display:block;font-size:9px;font-weight:700;color:var(--red);
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
</style>
</head>
<body>
<div class="sp-overlay" id="spOverlay" onclick="closeSPFilter()"></div>
<header>
  <div class="logo"><a href="index.html">巨乳・爆乳<span>まとめ</span></a></div>
  <input class="h-search" id="titleSearch" type="text" placeholder="タイトルで絞り込み...">
  <div class="h-count" id="countDisplay"></div>
  <button class="sp-filter-btn" onclick="openSPFilter()">☰</button>
</header>
<div class="breadcrumb"><a href="index.html">トップ</a> › 姫野かりす</div>
<div class="actress-hero">
  <img class="hero-img" src="http://pics.dmm.co.jp/mono/actjpgs/himeno_karisu.jpg" alt="姫野かりす">
  <div>
    <div class="hero-name"><span>姫野かりす</span> 出演作品まとめ</div>
    <div class="hero-meta">B92 / W55 / H90　<span class="hero-cup">Gカップ</span></div>
    <div class="hero-meta" style="margin-top:4px">全 0 件 ／ 2026/08/08 04:28 時点</div>
    
  </div>
</div>
<div class="layout">
  <aside id="spAside">
    <button class="sp-close-btn" onclick="closeSPFilter()">×</button>
    
    <div class="s-section"><button class="clear-link" id="clearAll">すべてクリア</button></div>
  </aside>
  <div class="main-wrap">
    <div class="chips" id="chips"></div>
    <div class="works-grid" id="grid">

      <div class="empty" id="emptyMsg" style="display:none">該当作品がありませんでした</div>
    </div>
  </div>
</div>
<footer style="text-align:center;padding:24px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);margin-top:20px">
  当サイトはアフィリエイトリンクを含みます。© 2025 巨乳・爆乳好きのまとめサイト　｜　<a href="notice.html" style="color:var(--muted);text-decoration:underline">免責事項・画像について</a><br><br>
  <a href="https://affiliate.dmm.com/api/"><img src="https://p.dmm.co.jp/p/affiliate/web_service/r18_135_17.gif" width="135" height="17" alt="WEB SERVICE BY FANZA"></a>
</footer>
<script>
const cards   = document.querySelectorAll(".work-card");
const selected = { genre: new Set(), director: new Set(), maker: new Set(), actress: new Set() };
let titleQuery = "";

function applyFilter() {
  let count = 0;
  cards.forEach(card => {
    const ok =
      (!titleQuery || (card.dataset.title||"").includes(titleQuery)) &&
      (selected.genre.size    === 0 || [...selected.genre   ].every(v => (card.dataset.genres   ||"").split(",").includes(v))) &&
      (selected.director.size === 0 || [...selected.director].every(v => (card.dataset.directors||"").split(",").includes(v))) &&
      (selected.maker.size    === 0 || selected.maker.has(card.dataset.maker||"")) &&
      (selected.actress.size  === 0 || [...selected.actress ].every(v => (card.dataset.actresses||"").split(",").includes(v)));
    card.classList.toggle("hidden", !ok);
    if (ok) count++;
  });
  document.getElementById("countDisplay").textContent = count + " 件";
  document.getElementById("emptyMsg").style.display   = count === 0 ? "block" : "none";
  renderChips();
}

function renderChips() {
  const el = document.getElementById("chips");
  el.innerHTML = "";
  Object.entries(selected).forEach(([kind, set]) => {
    set.forEach(val => {
      const c = document.createElement("span");
      c.className = "chip";
      c.innerHTML = val + ` <button onclick="removeFilter('${kind}','${val}')">×</button>`;
      el.appendChild(c);
    });
  });
}

document.querySelectorAll(".tag[data-kind]").forEach(el => {
  el.onclick = () => {
    const kind = el.dataset.kind, val = el.dataset.val;
    selected[kind].has(val) ? selected[kind].delete(val) : selected[kind].add(val);
    el.classList.toggle("active");
    applyFilter();
  };
});

window.filterGenre = (g) => {
  selected.genre.add(g);
  document.querySelector(`.tag[data-kind="genre"][data-val="${g}"]`)?.classList.add("active");
  applyFilter();
};

document.getElementById("titleSearch").oninput = e => { titleQuery = e.target.value.trim(); applyFilter(); };
document.getElementById("clearAll").onclick = () => {
  Object.values(selected).forEach(s => s.clear());
  titleQuery = "";
  document.getElementById("titleSearch").value = "";
  document.querySelectorAll(".tag.active").forEach(t => t.classList.remove("active"));
  applyFilter();
};

window.removeFilter = (kind, val) => {
  selected[kind].delete(val);
  document.querySelector(`.tag[data-kind="${kind}"][data-val="${val}"]`)?.classList.remove("active");
  applyFilter();
};

window.toggleCostarList = () => {
  const el  = document.getElementById("costarHidden");
  const btn = document.getElementById("costarBtn");
  if (!el) return;
  if (el.style.display === "none") {
    el.style.display = "flex";
    btn.textContent = "▲ 閉じる";
  } else {
    el.style.display = "none";
    const n = el.querySelectorAll("a,span").length;
    btn.textContent = "+ " + n + "人 もっと見る";
  }
};

applyFilter();

// スマホフィルター開閉
window.openSPFilter  = () => { document.getElementById("spAside").classList.add("open"); document.getElementById("spOverlay").classList.add("open"); };
window.closeSPFilter = () => { document.getElementById("spAside").classList.remove("open"); document.getElementById("spOverlay").classList.remove("open"); };
</script>
</body>
</html>
